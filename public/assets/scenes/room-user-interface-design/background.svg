<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="none">
  <!--
    UniGame interim background v2: User Interface Design studio (hand-built
    vector, replaceable by final raster art — see planning/ART_BRIEFS.md).
    Anchor skeleton preserved exactly (ART_PIPELINE.md): exit door 42-198,
    mission terminal 180-370×250-550 (cells/count are engine widgets),
    noticeboard 400-600×220-400 (notes widget), whiteboard 630-840×210-380,
    progress display 870-1110×190-390 (readouts widget), window 1140-1300×
    180-360, trophy bars y240/330 ×1330-1530 (trophy widget), desk 1080-1380
    (monitors 396-464, surface 470, chair/monitor-glow engine-drawn), holo
    table 750,666 (cone widget), floor 520. Ambience/dressing coordinates
    from the manifest also land on painted objects.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2050"/>
      <stop offset="70%" stop-color="#211840"/>
      <stop offset="100%" stop-color="#1a1233"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#281e44"/>
      <stop offset="55%" stop-color="#1c1533"/>
      <stop offset="100%" stop-color="#120d22"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170f36"/>
      <stop offset="55%" stop-color="#2c1c58"/>
      <stop offset="100%" stop-color="#5a3390"/>
    </linearGradient>
    <linearGradient id="neon-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b24bf3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b24bf3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191234"/>
      <stop offset="100%" stop-color="#130d28"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="76%">
      <stop offset="60%" stop-color="rgba(8,5,16,0)"/>
      <stop offset="100%" stop-color="rgba(8,5,16,0.5)"/>
    </radialGradient>
  </defs>

