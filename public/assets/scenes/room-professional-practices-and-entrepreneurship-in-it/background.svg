<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="none">
  <!--
    UniGame interim background v2: Professional Practices & Entrepreneurship
    startup incubator (hand-built vector; final raster briefs in
    planning/ART_BRIEFS.md). Anchor skeleton + ambience coordinates
    preserved: venture board 180-370×250-550 (cells/count engine-drawn),
    networking corkboard 400-600×220-400 (notes engine-pinned), business
    canvas 630-840×210-380, growth display 870-1110×190-390 (readouts
    engine-drawn; growth pulse rides 888,378→1096,288), window
    1140-1300×180-360 (warm glow at 1220,270), trophy case y240/330,
    pitch desk 1080-1380 (left screen covers the pitch pulse path
    1120,452→1226,408; chair/monitor-glow engine-drawn), demo-day table
    750,666, festoon bulbs at 360,113 and 1080,113 (blinkers) with engine
    sway lamps hung at 720,96 and 1200,96, floor 520.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3a29"/>
      <stop offset="70%" stop-color="#14291d"/>
      <stop offset="100%" stop-color="#0f2016"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20301f"/>
      <stop offset="55%" stop-color="#172315"/>
      <stop offset="100%" stop-color="#0d150c"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3d"/>
      <stop offset="45%" stop-color="#8a4a2e"/>
      <stop offset="100%" stop-color="#e0913d"/>
    </linearGradient>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12241a"/>
      <stop offset="100%" stop-color="#0e1c14"/>
