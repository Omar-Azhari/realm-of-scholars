    <linearGradient id="gold-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4c542" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f4c542" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warm-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a3d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff9a3d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="76%">
      <stop offset="60%" stop-color="rgba(5,10,7,0)"/>
      <stop offset="100%" stop-color="rgba(5,10,7,0.5)"/>
