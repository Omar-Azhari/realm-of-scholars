    <linearGradient id="blue-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3da9fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3da9fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="green-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ed17e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2ed17e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="76%">
      <stop offset="60%" stop-color="rgba(4,9,16,0)"/>
      <stop offset="100%" stop-color="rgba(4,9,16,0.52)"/>
    </radialGradient>
  </defs>

