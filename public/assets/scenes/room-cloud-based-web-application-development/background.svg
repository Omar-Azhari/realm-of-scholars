<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="none">
  <!--
    UniGame interim background v2: Cloud-Based Web Application Development
    server laboratory (hand-built vector; final raster briefs in
    planning/ART_BRIEFS.md). Anchor skeleton + ambience coordinates
    preserved: deploy rack 180-370×250-550 (cells/count engine-drawn, LED
    dots at 210/340 y261), mini-rack LEDs x176 y575/591/607, ticket board
    400-600×220-400 (notes engine-pinned), network map 630-840×210-380
    with nodes exactly at 672,256 / 736,300 / 800,252 / 700,348 / 792,342
    (scan pulses travel those edges), uptime monitor 870-1110×190-390
    (readouts engine-drawn, LED 1096,206), window 1140-1300×180-360,
    badge shelves y240/330, desk 1080-1380 (screens cover flicker rects
    1112,400 102×60 and 1240,408 88×52; chair/monitor-glow engine-drawn),
    holo globe base 750,666, floor 520.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f4b"/>
      <stop offset="70%" stop-color="#132538"/>
      <stop offset="100%" stop-color="#0e1c2c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17293e"/>
      <stop offset="55%" stop-color="#101e2f"/>
      <stop offset="100%" stop-color="#091420"/>
    </linearGradient>
    <linearGradient id="dc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#123147"/>
    </linearGradient>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1e30"/>
      <stop offset="100%" stop-color="#0b1826"/>
