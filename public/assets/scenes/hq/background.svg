<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="none">
  <!--
    UniGame interim background v2: Campus HQ main hall (hand-built vector,
    still replaceable by final raster art — see planning/ART_BRIEFS.md).
    Anchors preserved exactly (see planning/ART_PIPELINE.md):
      doors x 275/625/975/1325 (recess ±91, y 230-520) · windows cx 450/800/1150
      (twinkle ambience dots land on building windows) · kiosk screen 536,574
      62x36 · vending 1452-1544 · benches cx 290/1310 · lamps x 400/800/1200 ·
      floor y 520 · signage band y 186-228 is engine-drawn (kept clear).
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26335a"/>
      <stop offset="72%" stop-color="#1b2647"/>
      <stop offset="100%" stop-color="#16203c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3654"/>
      <stop offset="55%" stop-color="#1d2740"/>
      <stop offset="100%" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c3e"/>
      <stop offset="50%" stop-color="#1f2f68"/>
      <stop offset="100%" stop-color="#3a54a8"/>
    </linearGradient>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141d38"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <radialGradient id="emblem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.30)"/>
      <stop offset="70%" stop-color="rgba(34, 211, 238, 0.09)"/>
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop offset="64%" stop-color="rgba(5,8,16,0)"/>
      <stop offset="100%" stop-color="rgba(5,8,16,0.42)"/>
    </radialGradient>
    <linearGradient id="refl-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b24bf3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#b24bf3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="refl-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3da9fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3da9fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="refl-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb238" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffb238" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="refl-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ed17e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2ed17e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="refl-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a54a8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3a54a8" stop-opacity="0"/>
    </linearGradient>

    <!-- Night-city window, centred on x=0. Building rects keep the manifest
         twinkle-dot coordinates on lit facades. -->
    <g id="window">
      <rect x="-70" y="192" width="140" height="178" rx="9" fill="#0a101f"/>
      <rect x="-61" y="200" width="122" height="161" rx="5" fill="url(#city)"/>
      <circle cx="-40" cy="214" r="1.6" fill="#eef4ff" opacity="0.85"/>
      <circle cx="-12" cy="226" r="1.2" fill="#eef4ff" opacity="0.6"/>
      <circle cx="16" cy="210" r="1.3" fill="#eef4ff" opacity="0.7"/>
      <circle cx="44" cy="220" r="1.1" fill="#eef4ff" opacity="0.55"/>
      <circle cx="34" cy="228" r="9" fill="#eef4ff" opacity="0.92"/>
      <circle cx="30" cy="224" r="8" fill="url(#city)"/>
      <!-- skyline: far row -->
      <rect x="-58" y="262" width="14" height="99" fill="#1a2a5e"/>
      <rect x="-40" y="252" width="12" height="109" fill="#16244f"/>
      <rect x="24" y="256" width="12" height="105" fill="#1a2a5e"/>
      <rect x="48" y="266" width="12" height="95" fill="#16244f"/>
      <!-- skyline: near row (twinkle dots land here) -->
      <rect x="-50" y="272" width="24" height="89" fill="#121d42"/>
      <rect x="-20" y="244" width="20" height="117" fill="#0f1a3a"/>
      <rect x="6" y="284" width="26" height="77" fill="#121d42"/>
      <rect x="38" y="258" width="18" height="103" fill="#0f1a3a"/>
      <line x1="-10" y1="232" x2="-10" y2="244" stroke="#0f1a3a" stroke-width="2"/>
      <circle cx="-10" cy="231" r="1.6" fill="#ff5c7a" opacity="0.9"/>
      <!-- lit facade windows -->
      <rect x="-46" y="282" width="5" height="6" fill="#ffd88a" opacity="0.95"/>
      <rect x="-38" y="296" width="4" height="5" fill="#8fe7ff" opacity="0.8"/>
      <rect x="-18" y="282" width="5" height="6" fill="#8fe7ff" opacity="0.95"/>
      <rect x="-12" y="306" width="4" height="5" fill="#ffd88a" opacity="0.8"/>
      <rect x="10" y="306" width="5" height="6" fill="#8fe7ff" opacity="0.9"/>
      <rect x="18" y="292" width="4" height="5" fill="#ffd88a" opacity="0.75"/>
      <rect x="42" y="306" width="5" height="6" fill="#ffd88a" opacity="0.9"/>
      <rect x="46" y="330" width="4" height="5" fill="#8fe7ff" opacity="0.75"/>
      <rect x="-44" y="333" width="4" height="5" fill="#8fe7ff" opacity="0.7"/>
      <rect x="12" y="333" width="4" height="5" fill="#ffd88a" opacity="0.7"/>
      <!-- mullions + sill -->
      <line x1="0" y1="200" x2="0" y2="361" stroke="#0a101f" stroke-width="4"/>
      <rect x="-70" y="366" width="140" height="6" rx="3" fill="#101830"/>
    </g>

    <!-- Door recess + frame (panels/signage engine-drawn); frame colour via use@color -->
    <g id="door-recess">
      <rect x="-91" y="230" width="182" height="290" fill="#0b1122"/>
      <rect x="-88" y="233" width="176" height="287" fill="#0d1428"/>
      <rect x="-84" y="238" width="168" height="282" fill="none" stroke="currentColor" stroke-opacity="0.92" stroke-width="5"/>
      <rect x="-84" y="238" width="168" height="6" fill="currentColor" opacity="0.35"/>
    </g>

    <!-- Ceiling lamp fixture (light cones come from the manifest) -->
    <g id="lamp">
      <line x1="0" y1="0" x2="0" y2="32" stroke="#2a3550" stroke-width="3"/>
      <rect x="-28" y="32" width="56" height="11" rx="4" fill="#1b2338" stroke="#2f3a5c" stroke-width="1.5"/>
      <ellipse cx="0" cy="45" rx="19" ry="5" fill="#ffe29c" opacity="0.95"/>
      <ellipse cx="0" cy="45" rx="9" ry="3" fill="#fff6dd" opacity="0.9"/>
    </g>

    <!-- Bench with cushion -->
    <g id="bench">
      <ellipse cx="0" cy="662" rx="90" ry="11" fill="#000" opacity="0.3"/>
      <rect x="-82" y="612" width="164" height="16" rx="6" fill="#26304c" stroke="#37436b" stroke-width="2"/>
      <rect x="-78" y="604" width="72" height="10" rx="4" fill="#324066"/>
      <rect x="8" y="604" width="68" height="10" rx="4" fill="#324066"/>
      <rect x="-74" y="628" width="12" height="26" fill="#1a2138"/>
      <rect x="62" y="628" width="12" height="26" fill="#1a2138"/>
      <rect x="-82" y="596" width="164" height="6" rx="3" fill="#3a4a76"/>
    </g>

    <!-- Pennant string in the four subject colours -->
    <g id="pennants">
      <path d="M0 0 q 55 16 110 0 q 55 16 110 0 q 55 16 110 0 q 55 16 110 0" fill="none" stroke="#2f3a5c" stroke-width="2"/>
      <path d="M28 6 l9 16 l9 -14 Z" fill="#b24bf3"/>
      <path d="M138 6 l9 16 l9 -14 Z" fill="#3da9fc"/>
      <path d="M248 6 l9 16 l9 -14 Z" fill="#ffb238"/>
      <path d="M358 6 l9 16 l9 -14 Z" fill="#2ed17e"/>
    </g>
  </defs>

  <!-- ======================= CEILING ======================= -->
  <rect x="0" y="0" width="1600" height="110" fill="#0b1122"/>
  <!-- skylight strip with stars -->
  <rect x="520" y="6" width="560" height="30" rx="8" fill="#0d1734" stroke="#22305a" stroke-width="3"/>
  <circle cx="600" cy="20" r="1.6" fill="#eef4ff" opacity="0.9"/>
  <circle cx="702" cy="14" r="1.2" fill="#eef4ff" opacity="0.6"/>
  <circle cx="804" cy="24" r="1.5" fill="#eef4ff" opacity="0.8"/>
  <circle cx="920" cy="15" r="1.2" fill="#eef4ff" opacity="0.65"/>
  <circle cx="1012" cy="22" r="1.4" fill="#eef4ff" opacity="0.8"/>
  <line x1="706" y1="6" x2="706" y2="36" stroke="#22305a" stroke-width="3"/>
  <line x1="894" y1="6" x2="894" y2="36" stroke="#22305a" stroke-width="3"/>
  <!-- beams + conduit -->
  <rect x="-6" y="0" width="12" height="102" fill="#101a30"/>
  <rect x="394" y="0" width="12" height="102" fill="#101a30"/>
  <rect x="794" y="0" width="12" height="102" fill="#101a30"/>
  <rect x="1194" y="0" width="12" height="102" fill="#101a30"/>
  <rect x="1594" y="0" width="12" height="102" fill="#101a30"/>
  <line x1="0" y1="88" x2="1600" y2="88" stroke="#182240" stroke-width="4"/>
  <rect x="238" y="84" width="10" height="8" fill="#22305a"/>
  <rect x="638" y="84" width="10" height="8" fill="#22305a"/>
  <rect x="1038" y="84" width="10" height="8" fill="#22305a"/>
  <rect x="1438" y="84" width="10" height="8" fill="#22305a"/>
  <rect x="0" y="102" width="1600" height="8" fill="#080d1a"/>

  <!-- ======================= BACK WALL ======================= -->
  <rect x="0" y="110" width="1600" height="410" fill="url(#wall)"/>
  <g stroke="rgba(255,255,255,0.03)" stroke-width="2">
    <line x1="40" y1="110" x2="40" y2="470"/><line x1="150" y1="110" x2="150" y2="470"/>
    <line x1="260" y1="110" x2="260" y2="470"/><line x1="370" y1="110" x2="370" y2="470"/>
    <line x1="480" y1="110" x2="480" y2="470"/><line x1="590" y1="110" x2="590" y2="470"/>
    <line x1="700" y1="110" x2="700" y2="470"/><line x1="810" y1="110" x2="810" y2="470"/>
    <line x1="920" y1="110" x2="920" y2="470"/><line x1="1030" y1="110" x2="1030" y2="470"/>
    <line x1="1140" y1="110" x2="1140" y2="470"/><line x1="1250" y1="110" x2="1250" y2="470"/>
    <line x1="1360" y1="110" x2="1360" y2="470"/><line x1="1470" y1="110" x2="1470" y2="470"/>
    <line x1="1580" y1="110" x2="1580" y2="470"/>
  </g>
  <!-- accent light strip + wainscot band -->
  <rect x="0" y="126" width="1600" height="3" fill="rgba(34,211,238,0.30)"/>
  <rect x="0" y="470" width="1600" height="50" fill="url(#wainscot)"/>
  <line x1="0" y1="470" x2="1600" y2="470" stroke="#2a3860" stroke-width="2.5"/>
  <rect x="0" y="506" width="1600" height="14" fill="#0d1426"/>

  <!-- pennant strings across the gaps between doors -->
  <use href="#pennants" transform="translate(390,136)"/>
  <use href="#pennants" transform="translate(740,136)"/>
  <use href="#pennants" transform="translate(1090,136)"/>

  <!-- ======================= WINDOWS ======================= -->
  <use href="#window" transform="translate(450,0)"/>
  <use href="#window" transform="translate(800,0)"/>
  <use href="#window" transform="translate(1150,0)"/>

  <!-- ======================= DOOR RECESSES ======================= -->
  <use href="#door-recess" transform="translate(275,0)" color="#b24bf3"/>
  <use href="#door-recess" transform="translate(625,0)" color="#3da9fc"/>
  <use href="#door-recess" transform="translate(975,0)" color="#ffb238"/>
  <use href="#door-recess" transform="translate(1325,0)" color="#2ed17e"/>

  <!-- ======================= LEFT NOOK ======================= -->
  <rect x="48" y="232" width="104" height="128" rx="8" fill="#0e1730" stroke="rgba(103,232,249,0.5)" stroke-width="2.5"/>
  <rect x="56" y="240" width="88" height="30" rx="4" fill="rgba(34,211,238,0.14)"/>
  <text x="100" y="261" text-anchor="middle" fill="#67e8f9" font-size="15" font-family="monospace" font-weight="bold">STUDY</text>
  <text x="100" y="292" text-anchor="middle" fill="#9aa6c0" font-size="12" font-family="monospace">HALL 1F</text>
  <line x1="60" y1="304" x2="140" y2="304" stroke="#22305a" stroke-width="2"/>
  <text x="100" y="324" text-anchor="middle" fill="#6d7ba0" font-size="10" font-family="monospace">04 ROOMS</text>
  <text x="100" y="342" text-anchor="middle" fill="#6d7ba0" font-size="10" font-family="monospace">EST. 2026</text>
  <!-- plant -->
  <ellipse cx="100" cy="516" rx="34" ry="7" fill="#000" opacity="0.3"/>
  <rect x="76" y="470" width="48" height="38" rx="3" fill="#221a10"/>
  <rect x="76" y="470" width="48" height="8" fill="#2c2214"/>
  <path d="M100 470 q -28 -32 -13 -60 q 13 17 13 30 q 2 -24 17 -37 q 9 28 -4 67 Z" fill="#2ed17e"/>
  <path d="M100 470 q 18 -22 12 -46 q -12 10 -12 24 Z" fill="#1fa35f"/>

  <!-- ======================= RIGHT NOOK: corkboard + vending ======================= -->
  <rect x="1380" y="150" width="118" height="80" rx="6" fill="#2a1c14" stroke="#4a3423" stroke-width="4"/>
  <rect x="1390" y="160" width="28" height="34" rx="2" fill="#f6e7b2" transform="rotate(-4 1404 177)"/>
  <rect x="1424" y="158" width="28" height="34" rx="2" fill="#cfe8ff" transform="rotate(3 1438 175)"/>
  <rect x="1458" y="162" width="28" height="34" rx="2" fill="#f8cfe8" transform="rotate(-2 1472 179)"/>
  <circle cx="1404" cy="163" r="2.4" fill="#d64545"/>
  <circle cx="1438" cy="161" r="2.4" fill="#d64545"/>
  <circle cx="1472" cy="165" r="2.4" fill="#d64545"/>
  <!-- vending machine (screen anchored for manifest glow at 1452-1544) -->
  <ellipse cx="1498" cy="526" rx="52" ry="9" fill="#000" opacity="0.32"/>
  <rect x="1452" y="300" width="92" height="220" rx="6" fill="#101a2e" stroke="rgba(34,211,238,0.55)" stroke-width="3"/>
  <rect x="1464" y="316" width="52" height="150" fill="#0a101f"/>
  <rect x="1470" y="324" width="16" height="30" fill="#f345c0" opacity="0.9"/>
  <rect x="1494" y="324" width="16" height="30" fill="#3da9fc" opacity="0.9"/>
  <rect x="1470" y="368" width="16" height="30" fill="#ffb238" opacity="0.9"/>
  <rect x="1494" y="368" width="16" height="30" fill="#2ed17e" opacity="0.9"/>
  <rect x="1470" y="412" width="16" height="30" fill="#b24bf3" opacity="0.9"/>
  <rect x="1494" y="412" width="16" height="30" fill="#67e8f9" opacity="0.9"/>
  <rect x="1466" y="448" width="48" height="12" rx="3" fill="#182240"/>
  <rect x="1524" y="330" width="12" height="70" rx="3" fill="#22d3ee" opacity="0.75"/>
  <rect x="1524" y="404" width="12" height="26" rx="3" fill="#0a101f"/>

  <!-- ======================= FLOOR ======================= -->
  <rect x="0" y="520" width="1600" height="240" fill="url(#floor)"/>
  <!-- perspective seams -->
  <g stroke="rgba(255,255,255,0.045)" stroke-width="2">
    <line x1="0" y1="560" x2="1600" y2="560"/>
    <line x1="0" y1="606" x2="1600" y2="606"/>
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="300" y1="520" x2="196" y2="760"/>
    <line x1="520" y1="520" x2="462" y2="760"/>
    <line x1="740" y1="520" x2="724" y2="760"/>
    <line x1="960" y1="520" x2="982" y2="760"/>
    <line x1="1180" y1="520" x2="1240" y2="760"/>
    <line x1="1400" y1="520" x2="1500" y2="760"/>
  </g>
  <!-- door + window glow reflections on the polished floor -->
  <rect x="205" y="520" width="140" height="130" fill="url(#refl-violet)"/>
  <rect x="555" y="520" width="140" height="130" fill="url(#refl-blue)"/>
  <rect x="905" y="520" width="140" height="130" fill="url(#refl-amber)"/>
  <rect x="1255" y="520" width="140" height="130" fill="url(#refl-green)"/>
  <rect x="392" y="520" width="116" height="86" fill="url(#refl-window)"/>
  <rect x="742" y="520" width="116" height="86" fill="url(#refl-window)"/>
  <rect x="1092" y="520" width="116" height="86" fill="url(#refl-window)"/>
  <!-- wall contact shadow -->
  <rect x="0" y="520" width="1600" height="10" fill="rgba(0,0,0,0.35)"/>

  <!-- carpet runner + emblem -->
  <rect x="90" y="588" width="1420" height="96" rx="10" fill="#1b2544" stroke="rgba(34,211,238,0.5)" stroke-width="2.5"/>
  <rect x="98" y="596" width="1404" height="80" rx="8" fill="none" stroke="rgba(34,211,238,0.14)" stroke-width="2" stroke-dasharray="14 10"/>
  <ellipse cx="800" cy="636" rx="150" ry="42" fill="url(#emblem)"/>
  <ellipse cx="800" cy="636" rx="92" ry="26" fill="none" stroke="rgba(34,211,238,0.62)" stroke-width="2.5"/>
  <path d="M800 616 l 34 12 l -34 12 l -34 -12 Z" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.85"/>
  <line x1="820" y1="626" x2="820" y2="644" stroke="#22d3ee" stroke-width="2" opacity="0.75"/>
  <!-- floor chevrons guiding to each door -->
  <g stroke="rgba(103,232,249,0.30)" stroke-width="3" fill="none">
    <path d="M263 706 l12 -10 l12 10"/>
    <path d="M613 706 l12 -10 l12 10"/>
    <path d="M963 706 l12 -10 l12 10"/>
    <path d="M1313 706 l12 -10 l12 10"/>
  </g>

  <!-- ======================= FURNITURE + STORYTELLING ======================= -->
  <use href="#bench" transform="translate(290,0)"/>
  <use href="#bench" transform="translate(1310,0)"/>
  <!-- backpack leaning on the left bench -->
  <ellipse cx="222" cy="656" rx="24" ry="6" fill="#000" opacity="0.28"/>
  <path d="M206 616 q -4 30 4 38 l 28 0 q 8 -8 4 -38 q -8 -12 -36 0 Z" fill="#7a3040"/>
  <path d="M210 622 q 14 -8 28 0 l -2 10 q -12 -6 -24 0 Z" fill="#93404f"/>
  <rect x="216" y="636" width="16" height="10" rx="3" fill="#5c2430"/>
  <!-- coffee cup on the right bench -->
  <rect x="1352" y="580" width="12" height="16" rx="2" fill="#e8e4d8"/>
  <rect x="1352" y="580" width="12" height="4" fill="#b8a88a"/>
  <path d="M1358 574 q 1 -4 3 -2" stroke="#c7d0da" stroke-width="1.4" fill="none" opacity="0.8"/>
  <!-- dropped flyer -->
  <rect x="1028" y="700" width="30" height="20" rx="2" fill="#cfe8ff" transform="rotate(-8 1043 710)" opacity="0.9"/>
  <line x1="1034" y1="704" x2="1052" y2="702" stroke="#5b6478" stroke-width="1.6" transform="rotate(-8 1043 710)"/>

  <!-- info kiosk (holo screen anchored for manifest flicker at 536,574) -->
  <ellipse cx="567" cy="656" rx="28" ry="7" fill="#000" opacity="0.32"/>
  <rect x="560" y="606" width="14" height="46" fill="#1a2138"/>
  <rect x="556" y="648" width="22" height="6" rx="3" fill="#26304c"/>
  <rect x="536" y="574" width="62" height="36" rx="5" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="544" y="582" width="18" height="8" rx="2" fill="#22d3ee" opacity="0.75"/>
  <rect x="566" y="582" width="24" height="8" rx="2" fill="#22d3ee" opacity="0.45"/>
  <rect x="544" y="594" width="34" height="8" rx="2" fill="#22d3ee" opacity="0.6"/>

  <!-- ======================= LAMP FIXTURES ======================= -->
  <use href="#lamp" transform="translate(400,0)"/>
  <use href="#lamp" transform="translate(800,0)"/>
  <use href="#lamp" transform="translate(1200,0)"/>

  <!-- ======================= VIGNETTE ======================= -->
  <rect x="0" y="0" width="1600" height="760" fill="url(#vignette)"/>
</svg>
