    <rect x="24" y="22" width="14" height="9" rx="2" fill="#232b4e"/>
    <rect x="8" y="38" width="12" height="9" rx="2" fill="#ffb238"/>
    <rect x="24" y="38" width="14" height="9" rx="2" fill="#232b4e"/>
