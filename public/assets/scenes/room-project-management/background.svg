<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="none">
  <!--
    UniGame interim background v2: Project Management operations & strategy
    room (hand-built vector; final raster briefs in planning/ART_BRIEFS.md).
    Anchor skeleton + ambience coordinates preserved: sprint board
    180-370×250-550 (cells/count engine-drawn), sticky wall 400-600×220-400
    (notes engine-pinned; flicker rect 410,230 180×160 stays inside),
    Gantt board 630-840×210-380 with the timeline dot running y=368 from
    x648 to x816, wall clock EXACTLY at 120,180 (engine pendulum anchor),
    burndown display 870-1110×190-390 (readouts engine-drawn, LED 1096,206),
    window 1140-1300×180-360, award shelves y240/330, desk 1080-1380
    (chair/monitor-glow engine-drawn), timeline table 750,666, floor 520.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252d58"/>
      <stop offset="70%" stop-color="#1a2142"/>
      <stop offset="100%" stop-color="#141a34"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232b4e"/>
      <stop offset="55%" stop-color="#181f3a"/>
      <stop offset="100%" stop-color="#0f1428"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181233"/>
      <stop offset="55%" stop-color="#3a2560"/>
      <stop offset="100%" stop-color="#8a4a7a"/>
    </linearGradient>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a34"/>
      <stop offset="100%" stop-color="#101528"/>
    </linearGradient>
    <linearGradient id="amber-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb238" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffb238" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purple-refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5fe0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5fe0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="76%">
      <stop offset="60%" stop-color="rgba(6,7,14,0)"/>
      <stop offset="100%" stop-color="rgba(6,7,14,0.5)"/>
    </radialGradient>
  </defs>

  <!-- ======================= CEILING ======================= -->
  <rect x="0" y="0" width="1600" height="96" fill="#0f1328"/>
  <rect x="0" y="90" width="1600" height="6" fill="#0a0d1c"/>
  <rect x="140" y="58" width="1320" height="7" rx="3.5" fill="#ffb238"/>
  <rect x="140" y="65" width="1320" height="18" fill="#ffb238" opacity="0.12"/>
