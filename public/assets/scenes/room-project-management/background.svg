    <rect x="24" y="70" width="14" height="9" rx="2" fill="#232b4e"/>
    <rect x="8" y="86" width="12" height="9" rx="2" fill="#2ed17e"/>
    <rect x="24" y="86" width="14" height="9" rx="2" fill="#232b4e"/>
